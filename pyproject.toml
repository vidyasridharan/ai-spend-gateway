[project]
name = "ai-spend-gateway"
version = "0.1.0"
description = "Real-time token metering and spend-control gateway for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.11.0",
    "redis>=7.0.1",
    "tiktoken>=0.14.0",
    "uvicorn>=0.39.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gateway"
module-root = "src"

